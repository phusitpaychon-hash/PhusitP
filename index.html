<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakout Target Calculator</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--tx:#111827;--mu:#6b7280;--bd:#e2e5ea;--ac:#1d4ed8;
  --up:#0b8a4b;--dn:#c62828;--ln:#1f2937;--grid:#e5e7eb;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1016;--card:#161a22;--tx:#e8eaef;--mu:#8b93a1;--bd:#262c37;--ac:#6ea0ff;
  --up:#3ddc84;--dn:#ff6b60;--ln:#d5d9e0;--grid:#232935;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto}
header{margin:4px 0 16px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:0 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.seg button{padding:12px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:600 15px inherit;font-family:inherit;cursor:pointer}
.seg button.on.buy{background:var(--up);border-color:var(--up);color:#fff}
.seg button.on.sell{background:var(--dn);border-color:var(--dn);color:#fff}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
input{width:100%;padding:11px 12px;font:500 16px inherit;font-family:inherit;font-variant-numeric:tabular-nums;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input:focus{outline:2px solid var(--ac);outline-offset:-1px}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.res{grid-template-columns:repeat(4,1fr)}}
.r{border:1px solid var(--bd);border-radius:10px;padding:12px}
.r b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all}
.r.t{border-left:3px solid var(--c)}
.r.t b{color:var(--c)}
.r .lbl{margin-bottom:4px;font-size:10px}
#chart{width:100%}
#chart svg{display:block;max-width:100%}
.note{margin:8px 0 0;font-size:11px;color:var(--mu)}
svg text{font-family:inherit}
footer{text-align:center;color:var(--mu);font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<section class="card">
  <div class="seg">
    <button id="bBuy" class="buy" type="button">Buy</button>
    <button id="bSell" class="sell" type="button">Sell</button>
  </div>
  <div class="fields">
    <div><label class="lbl" for="bars">Bars</label><input id="bars" type="number" inputmode="decimal" min="0" step="any"></div>
    <div><label class="lbl" for="atr">ATR</label><input id="atr" type="number" inputmode="decimal" min="0" step="any"></div>
    <div><label class="lbl" for="bp">Breakout Price</label><input id="bp" type="number" inputmode="decimal" step="any"></div>
  </div>
</section>

<section class="card">
  <div class="res" id="res"></div>
</section>

<section class="card" id="chartCard" hidden>
  <div id="chart"></div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const f=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let bias=null;

function setBias(b){
  bias=b;
  $('bBuy').classList.toggle('on',b==='buy');
  $('bSell').classList.toggle('on',b==='sell');
  render();
}
$('bBuy').onclick=()=>setBias('buy');
$('bSell').onclick=()=>setBias('sell');
['bars','atr','bp'].forEach(i=>$(i).addEventListener('input',render));
window.addEventListener('resize',render);

function cards(vals,c,dir){
  const v=vals||['—','—','—','—'];
  return `
  <div class="r"><span class="lbl">Distance 1</span><b>${v[0]}</b></div>
  <div class="r"><span class="lbl">Distance 2</span><b>${v[1]}</b></div>
  <div class="r t" style="--c:${c}"><span class="lbl">Target 1${dir?' ('+dir+')':''}</span><b>${v[2]}</b></div>
  <div class="r t" style="--c:${c}"><span class="lbl">Target 2${dir?' ('+dir+')':''}</span><b>${v[3]}</b></div>`;
}

function draw(buy,B,bp,t1,t2){
  const m=buy?1:-1, d2=Math.abs(t2-bp);
  const W=Math.max(300,Math.floor($('chart').clientWidth)||360);
  const H=Math.round(Math.max(460,Math.min(W*.85,640)));
  const L=92,R=16,T=48,Bm=84,pw=W-L-R,ph=H-T-Bm;
  // structure in buy frame: [x in Bars units (High2 / Low2 = 0), level in Distance2 units]
  const pat=[[-.95,.45],[-.65,.9],[-.35,.5],[0,1.05],[.33,0],[.66,1.15],[1,-.06]];
  const tags=buy?['','PS','','BC','SoW','UTAD','']:['','PS','','SC','SoS','Spring',''];
  const hs=pat.map(p=>m*p[1]), tH=[m*-.5,m*-1];
  const all=hs.concat(tH,[0]);
  const hmin=Math.min(...all)-.03, hmax=Math.max(...all)+.03;
  const X=x=>L+(x+.95)/2.25*pw, Y=h=>T+(hmax-h)/(hmax-hmin)*ph;
  const price=h=>bp+h*d2;
  const tc=buy?'var(--dn)':'var(--up)';
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Structure and targets">`;

  // grid + price axis
  [[0,'Breakout','var(--tx)'],[tH[0],'Target 1',tc],[tH[1],'Target 2',tc]].forEach(([h,nm,c],i)=>{
    const y=Y(h);
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    s+=`<text x="${L-8}" y="${y+4}" font-size="12" font-weight="600" text-anchor="end" fill="${c}" style="font-variant-numeric:tabular-nums">${f(price(h))}</text>`;
  });
  s+=`<line x1="${L}" x2="${L}" y1="${T-12}" y2="${T+ph}" stroke="var(--bd)"/>`;

  // structure line
  s+=`<polyline fill="none" stroke="var(--ln)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pat.map((p,i)=>X(p[0])+','+Y(hs[i])).join(' ')}"/>`;

  // breakout level and targets
  const xb=X(1), xs=X(pat[4][0]);
  s+=`<line x1="${xs}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ln)" stroke-width="1.5"/>`;
  s+=`<text x="${W-R}" y="${Y(0)+(buy?-6:15)}" font-size="12" font-weight="600" text-anchor="end" fill="var(--tx)">Breakout</text>`;
  s+=`<line x1="${xb}" x2="${xb}" y1="${Y(0)}" y2="${Y(tH[1])}" stroke="${tc}" stroke-width="1.5" stroke-dasharray="2 3"/>`;
  [[tH[0],'Target 1'],[tH[1],'Target 2']].forEach(([h,nm])=>{
    const y=Y(h);
    s+=`<line x1="${xb}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${tc}" stroke-width="1.8" stroke-dasharray="6 4"/>`;
    s+=`<circle cx="${xb}" cy="${y}" r="3.5" fill="${tc}"/>`;
    s+=`<text x="${W-R}" y="${y+(buy?-6:15)}" font-size="12" font-weight="700" text-anchor="end" fill="${tc}">${nm}</text>`;
  });

  // swing markers and tags
  pat.forEach((p,i)=>{
    const x=X(p[0]),y=Y(hs[i]);
    s+=`<circle cx="${x}" cy="${y}" r="${i===6?4:3.5}" fill="${i===6?tc:'var(--ln)'}"/>`;
    if(!tags[i])return;
    const peak=hs[i]>hs[i-1]&&hs[i]>hs[i+1];
    s+=`<text x="${x}" y="${y+(peak?-11:20)}" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ac)">${tags[i]}</text>`;
  });

  // bars bracket
  const x1=X(0), yb=T+ph+36;
  s+=`<line x1="${x1}" x2="${x1}" y1="${Y(hs[3])}" y2="${yb-7}" stroke="var(--ac)" stroke-width="1" stroke-dasharray="2 3" opacity=".45"/>`;
  s+=`<line x1="${xb}" x2="${xb}" y1="${Y(tH[1])}" y2="${yb-7}" stroke="var(--ac)" stroke-width="1" stroke-dasharray="2 3" opacity=".45"/>`;
  s+=`<path d="M${x1} ${yb-7}V${yb}H${xb}V${yb-7}" fill="none" stroke="var(--ac)" stroke-width="1.8"/>`;
  s+=`<text x="${(x1+xb)/2}" y="${yb+18}" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ac)">${B} Bars</text>`;
  return s+'</svg>';
}

function render(){
  const B=parseFloat($('bars').value),atr=parseFloat($('atr').value),bp=parseFloat($('bp').value);
  const ok=bias&&B>0&&atr>0&&!isNaN(bp);
  if(!ok){$('res').innerHTML=cards();$('chartCard').hidden=true;return}
  const buy=bias==='buy', d1=B*atr*.5, d2=B*atr, sg=buy?1:-1;
  const t1=bp+sg*d1, t2=bp+sg*d2, c=buy?'var(--up)':'var(--dn)';
  $('res').innerHTML=cards([f(d1),f(d2),f(t1),f(t2)],c,buy?'Up':'Down');
  $('chartCard').hidden=false;
  $('chart').innerHTML=draw(!buy,B,bp,t1,t2);
}
render();
</script>
</body>
</html>
